  <title id="fig-mst-vs-shortest-path-tree-title">The minimum spanning tree (13 km) and the shortest-path tree from A (17 km) are different trees on the same graph — greedy on total weight is not greedy on individual distance.</title>
  <desc id="fig-mst-vs-shortest-path-tree-desc">The same six-node graph drawn twice. On the left, Kruskal&#x27;s minimum spanning tree: five thick solid edges totalling 13 kilometres. On the right, the shortest-path tree that Dijkstra builds from A: five thick solid edges totalling 17 kilometres. In both panels the unused edges are thin and dashed. The two trees share some edges but not all: the spanning tree minimises the total length of the network, while the shortest-path tree minimises each individual distance from A and is therefore heavier overall.</desc>
