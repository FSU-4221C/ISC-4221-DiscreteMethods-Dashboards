  <title id="fig-dijkstra-example-graph-title">The shortest route from A to F runs A to C to E to F and totals 11 kilometres — not the shorter-looking A, B, D, F, which costs 15.</title>
  <desc id="fig-dijkstra-example-graph-desc">A weighted undirected graph of six nodes, A to F, and nine edges. The shortest path from A to F is drawn as a thick solid line through A, C, E, F; the other edges are thin and dashed. Every edge carries its weight in a small box at its midpoint, and every node carries its final Dijkstra distance beneath it. Hop count is not the deciding factor: the route through B and D takes the same three hops but costs 15 kilometres against 11, because its first two edges are heavy.</desc>
