  <title id="fig-bfs-vs-dfs-title">On the same graph from the same start, breadth-first visits A B C D E F G and depth-first visits A B D E F C G — a queue spreads out, a stack dives down.</title>
  <desc id="fig-bfs-vs-dfs-desc">The same seven-node graph drawn twice, with the visit order numbered on each node. On the left, breadth-first search from A numbers the nodes 1 to 7 in level order: A first, then both of its neighbours, then everything at distance two. On the right, depth-first search from A follows one branch to its end before backtracking, so a node three edges from A is visited before a node one edge from A. The graph, the start node and the neighbour ordering are identical in both panels; only the container differs.</desc>
