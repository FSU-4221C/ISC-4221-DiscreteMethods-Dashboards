  <title id="fig-lp-feasible-region-title">The optimum sits at the corner (4, 2) where the two constraints cross, worth 220 — the best of the four feasible corners.</title>
  <desc id="fig-lp-feasible-region-desc">The feasible region of a two-variable linear program, drawn as a shaded quadrilateral bounded by the x and y axes and the two constraint lines 2x + y = 10 and x + y = 6. Each constraint boundary is drawn with its own dash pattern and labelled with its equation. The four corners of the region are marked with filled discs and each is labelled with its coordinates and its objective value: (0, 0) is worth 0, (5, 0) is worth 200, (4, 2) is worth 220 and (0, 6) is worth 180. The best corner is ringed and labelled &#x27;optimum&#x27;. No interior point beats a corner, which is why checking the corners is enough.</desc>
