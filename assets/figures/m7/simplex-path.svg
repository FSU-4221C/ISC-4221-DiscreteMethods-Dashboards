  <title id="fig-simplex-path-title">Simplex walks (0, 0) to (3, 0) to (1.5, 2.5), raising z from 0 to 360 to 430 — three of the four corners, never the fourth.</title>
  <desc id="fig-simplex-path-desc">The feasible region of the two-product plant, a quadrilateral with corners at (0, 0), (3, 0), (1.5, 2.5) and (0, 4), shaded and outlined. The path simplex takes is drawn as two arrows: from the origin along the x axis to (3, 0), then up and left to (1.5, 2.5). Each visited corner is a filled disc labelled with its coordinates and its objective value, 0 then 360 then 430; the unvisited corner (0, 4) is an open circle labelled with its value of 400. Simplex never evaluates it, because every move it makes goes to an adjacent corner with a larger objective.</desc>
