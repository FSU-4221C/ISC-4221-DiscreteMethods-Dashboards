  <title id="fig-search-comparison-title">Sequential search needs up to n comparisons and binary search up to log base 2 of n: at n = 1000 that is 1000 against 10.</title>
  <desc id="fig-search-comparison-desc">Comparisons against array size n from 10 to 1000. Two series: sequential search, a solid rising straight line reaching 1000 comparisons at n = 1000; and binary search, a dashed line that is almost flat, reaching 10 at n = 1000. Both are labelled at their right-hand ends. The gap widens with n: at n = 100 it is 100 against 7, at n = 1000 it is 1000 against 10.</desc>
