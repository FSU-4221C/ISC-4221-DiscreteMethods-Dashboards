  <title id="fig-runtime-scaling-title">At one operation per nanosecond and n = 1000, an O(n) job finishes in microseconds and O(n squared) in a millisecond, but O(2 to the n) passes a year before n reaches 60.</title>
  <desc id="fig-runtime-scaling-desc">Log-log plot of runtime in seconds against input size n from 1 to 1000, assuming one operation per nanosecond. Six series, each dashed differently and labelled at its right-hand end: constant, logarithmic, linear, linearithmic, quadratic and exponential. Four horizontal dashed reference lines mark one second, one minute, one hour and one year. The five polynomial curves stay below one second across the whole range; the exponential curve crosses one second near n = 30, one hour near n = 42 and one year near n = 55, then leaves the panel.</desc>
