  <title id="fig-selection-sort-trace-title">Selection sort places one value per pass: after pass 1 the smallest value is in position 0, and after all seven passes the array is ordered.</title>
  <desc id="fig-selection-sort-trace-desc">Four bar charts of the same eight-value array at passes 1, 2, 3 and 7. Bars are drawn left to right by index, height proportional to value, and every bar carries its value as a number above it. Bars already in their final position are drawn solid; bars still unsorted are drawn with a hatched outline, so sorted and unsorted are distinguishable without colour. Across the four panels the solid region grows from the left until it covers the whole array.</desc>
