  <title id="fig-point-line-distance-title">The parameter s locates the foot of the perpendicular along the line: s between 0 and 1 lands on the segment, s below 0 lands before it, s above 1 lands past its end.</title>
  <desc id="fig-point-line-distance-desc">A line segment from A at (1, 1) to B at (5, 3), drawn solid and extended as a dashed ray in both directions. Four probe points are marked, each joined to the line by a dotted perpendicular ending in a small open square at the foot. Two feet land between A and B, one lands beyond B and one lands before A. Beside each probe point the value of s and the perpendicular distance are printed, so the sign of s and whether it exceeds 1 can be read directly.</desc>
