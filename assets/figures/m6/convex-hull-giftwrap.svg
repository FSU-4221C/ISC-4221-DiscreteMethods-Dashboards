  <title id="fig-convex-hull-giftwrap-title">Gift wrapping finds a 8-sided hull round ten points, enclosing 16.4 square units against the bounding box&#x27;s 24.0 — the hull is the tighter description of the data.</title>
  <desc id="fig-convex-hull-giftwrap-desc">Ten labelled points with their convex hull drawn as a closed solid polygon and the axis-aligned bounding box drawn as a dashed rectangle around it. The hull has 8 vertices, each marked with a filled disc and numbered in the order gift wrapping found it, starting from the leftmost point and going counter-clockwise. The 2 interior points are drawn as open crosses and are not numbered. The hull follows the outermost points closely, while the box leaves large empty corners.</desc>
