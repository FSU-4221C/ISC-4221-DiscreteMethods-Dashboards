  <title id="fig-ear-clipping-title">Ear clipping cuts this eight-vertex polygon into 6 triangles — always n minus 2 — after rejecting 1 candidates that were reflex or contained another vertex.</title>
  <desc id="fig-ear-clipping-desc">An eight-vertex non-convex polygon with its boundary drawn solid and the six diagonals that ear clipping introduced drawn dashed, dividing it into six triangles. Each vertex is labelled V1 to V8. The reflex vertices, where the interior angle exceeds 180 degrees, are marked with an open square and can never be ears; the rest are marked with a filled disc. Each triangle carries the step number at which it was clipped, so the order of removal is readable from the drawing.</desc>
