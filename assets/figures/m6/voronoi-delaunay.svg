  <title id="fig-voronoi-delaunay-title">Ten generators give 10 Voronoi cells and 10 Delaunay triangles; generator P7 owns the largest cell at 5.53 square units because it is the most isolated.</title>
  <desc id="fig-voronoi-delaunay-desc">Two panels showing the same ten generators. On the left, the Voronoi diagram: each generator is a filled disc labelled with its number, and the region of the plane closer to it than to any other is outlined as a polygon. On the right, the Delaunay triangulation: the same generators joined by straight edges wherever their Voronoi cells share a boundary. The two are duals — a shared Voronoi edge is exactly a Delaunay edge — so the right panel is the left one read the other way round. Cells near the middle of the point set are small; cells at the edge extend to the boundary of the region.</desc>
