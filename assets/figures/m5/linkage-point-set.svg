  <desc id="fig-linkage-point-set-desc">Twelve points scattered across an eight-by-eight grid, each labelled with its number. Cluster membership at a cut height of 2.5 is shown by marker shape as well as colour, and a dashed outline is drawn round each cluster. The clusters correspond to visible groupings: a loose band across the lower left, a pair on the right, and a group at the top. Point 4 sits between two groups, which is why it is the point whose cluster changes when the linkage rule changes.</desc>
