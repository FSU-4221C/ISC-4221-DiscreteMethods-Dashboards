  <title id="fig-brownian-path-title">After 240 independent steps the particle ends 3.95 units from where it started, against a root-mean-square prediction of 4.90.</title>
  <desc id="fig-brownian-path-desc">A two-dimensional random walk of 240 steps traced as a continuous line from a square marker at the origin to a diamond marker at the end point. The path doubles back on itself repeatedly and has no preferred direction, because the drift is zero. A dashed circle of radius equal to the root-mean-square prediction is drawn around the origin for scale; the end point lies near it rather than on it, which is what a single realisation of a random process looks like.</desc>
