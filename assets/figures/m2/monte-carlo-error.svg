  <title id="fig-monte-carlo-error-title">Monte Carlo error falls as one over the square root of n: a thousandfold increase in samples buys only about a thirtyfold improvement.</title>
  <desc id="fig-monte-carlo-error-desc">Log-log plot of absolute error in the estimate of pi against sample size n from 50 to 50,000. The measured errors, drawn as a solid line with round markers, scatter around a dashed reference line of slope minus one half anchored at the first point. Individual runs bounce above and below the reference — the law describes the envelope, not any one run — but the overall descent matches its slope across three decades of n.</desc>
