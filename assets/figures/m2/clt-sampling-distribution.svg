<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="fig-clt-sampling-distribution-title fig-clt-sampling-distribution-desc" class="fsu-figure" data-figure="clt-sampling-distribution">
  <title id="fig-clt-sampling-distribution-title">Averaging an exponential parent turns a hard right skew into a symmetric bell: skewness falls from 1.96 at n = 1 to 0.36 at n = 30.</title>
  <desc id="fig-clt-sampling-distribution-desc">Four histograms of the distribution of the sample mean, at sample sizes 1, 2, 5 and 30, all drawn on the same horizontal axis. At n = 1 the histogram is the exponential parent itself: a tall bar at the left and a long tail to the right. At n = 2 the peak has moved right and the tail shortened. At n = 5 the shape is recognisably humped. At n = 30 it is symmetric and narrow. Each panel prints its observed spread beside the value predicted by sigma over the square root of n, and the two agree to within a few thousandths.</desc>
